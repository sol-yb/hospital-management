version: '3.9'
services:
  api:
    build: .
    command: npm start
    ports:
      - "4000:4000"
    environment:
      - NODE_ENV=production
      - PORT=4000
      - MONGO_URI=mongodb://mongo:27017/hospital-management
      - JWT_SECRET=supersecretjwtkey
      - JWT_REFRESH_SECRET=refreshsecretkey
      - EMAIL_FROM=no-reply@hospital.local
    depends_on:
      - mongo
    volumes:
      - .:/usr/src/app
      - ./uploads:/usr/src/app/uploads
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
volumes:
  mongo-data: {}
